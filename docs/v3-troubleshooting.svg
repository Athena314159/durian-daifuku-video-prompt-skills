<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <rect width="1200" height="520" fill="#f8fafc"/>
  <text x="60" y="50" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#111827">遇到错误先看状态，再按对应动作处理</text>
  <g font-family="Arial, sans-serif" font-size="17">
    <rect x="60" y="90" width="330" height="72" rx="12" fill="#fee2e2"/><text x="80" y="120" fill="#991b1b">BLOCK_STALE_BUILD</text><text x="80" y="146" fill="#7f1d1d">文件改过 → 重新 compile，不改旧 build</text>
    <rect x="435" y="90" width="330" height="72" rx="12" fill="#fef3c7"/><text x="455" y="120" fill="#92400e">BLOCK_INCOMPLETE_IMAGE_DELIVERY</text><text x="455" y="146" fill="#78350f">缺批准图 → 先补图并做 QA</text>
    <rect x="810" y="90" width="330" height="72" rx="12" fill="#dbeafe"/><text x="830" y="120" fill="#1e40af">DOCX_EXPORT_BLOCKED</text><text x="830" y="146" fill="#1e3a8a">缺图/awaiting → 不会写半成品 Word</text>
    <rect x="60" y="210" width="330" height="72" rx="12" fill="#dcfce7"/><text x="80" y="240" fill="#166534">Prompt/参考不存在</text><text x="80" y="266" fill="#14532d">检查绝对路径与 SHA-256</text>
    <rect x="435" y="210" width="330" height="72" rx="12" fill="#fce7f3"/><text x="455" y="240" fill="#9d174d">包装状态不一致</text><text x="455" y="266" fill="#831843">盒、袋不能互换；修当前 S 镜头</text>
    <rect x="810" y="210" width="330" height="72" rx="12" fill="#ede9fe"/><text x="830" y="240" fill="#5b21b6">BLOCKED_VIDEO_BACKEND</text><text x="830" y="266" fill="#4c1d95">静态图已完，视频 provider 未接</text>
  </g>
  <path d="M600 330V390" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="220" y="395" width="760" height="72" rx="16" fill="#0f172a"/>
  <text x="600" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#fff">不要重复编译、重复渲染或绕过清单；修完对应字段后只重跑一次该阶段</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
</svg>
