<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <rect width="1200" height="520" fill="#fff"/>
  <text x="60" y="52" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#111827">自然语言 Prompt 五段写法</text>
  <g font-family="Arial, sans-serif">
    <g><rect x="70" y="100" width="200" height="105" rx="15" fill="#dbeafe"/><text x="170" y="137" font-size="20" text-anchor="middle" fill="#1e3a8a">目标</text><text x="170" y="169" font-size="16" text-anchor="middle" fill="#1e3a8a">我要改图/只取稿/导出</text></g>
    <g><rect x="300" y="100" width="200" height="105" rx="15" fill="#dcfce7"/><text x="400" y="137" font-size="20" text-anchor="middle" fill="#14532d">源片事实</text><text x="400" y="169" font-size="16" text-anchor="middle" fill="#14532d">路径、人物、动作、首帧</text></g>
    <g><rect x="530" y="100" width="200" height="105" rx="15" fill="#fef3c7"/><text x="630" y="137" font-size="20" text-anchor="middle" fill="#78350f">替换合同</text><text x="630" y="169" font-size="16" text-anchor="middle" fill="#78350f">女性1-AV001、7cm大福</text></g>
    <g><rect x="760" y="100" width="200" height="105" rx="15" fill="#fce7f3"/><text x="860" y="137" font-size="20" text-anchor="middle" fill="#831843">包装与状态</text><text x="860" y="169" font-size="16" text-anchor="middle" fill="#831843">盒/袋可见面、动作状态</text></g>
    <g><rect x="990" y="100" width="140" height="105" rx="15" fill="#ede9fe"/><text x="1060" y="137" font-size="20" text-anchor="middle" fill="#4c1d95">输出</text><text x="1060" y="169" font-size="16" text-anchor="middle" fill="#4c1d95">阶段与验收</text></g>
  </g>
  <path d="M80 270H1120" stroke="#94a3b8" stroke-width="3"/>
  <text x="80" y="315" font-family="Arial, sans-serif" font-size="18" fill="#334155">推荐句式：</text>
  <text x="80" y="354" font-family="Arial, sans-serif" font-size="18" fill="#0f172a">“请读取【视频路径】，先只返回原口播和逐镜事实；确认后，接收我下面的完整改稿；</text>
  <text x="80" y="388" font-family="Arial, sans-serif" font-size="18" fill="#0f172a">把人物换成【AV-001】，食品换成【批准大福状态】，包装按【盒/袋参考】；</text>
  <text x="80" y="422" font-family="Arial, sans-serif" font-size="18" fill="#0f172a">先生成图片任务并干跑，图片全部通过后再导出 DOCX，缺图就停止。”</text>
  <text x="80" y="474" font-family="Arial, sans-serif" font-size="16" fill="#64748b">关键：说清阶段、源片锁定项、替换对象、参考图职责和停止条件；不要只说“帮我做得自然一点”。</text>
</svg>
